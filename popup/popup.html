<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nivra</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- ─── Header ──────────────────────────────────────────────────────── -->
  <div class="popup-header">
    <img class="popup-logo" src="../assets/Logo.png" alt="Nivra Logo">
    <div class="popup-header-text">
      <div class="popup-title">
        Nivra
        <span class="popup-version">v1.6.0</span>
      </div>
      <div class="popup-subtitle">PDF Viewer &amp; Visual Engine</div>
    </div>
  </div>

  <!-- ─── Status Toggle ──────────────────────────────────────────────── -->
  <div class="popup-section">
    <div class="status-card active" id="status-card">
      <div class="status-left">
        <div class="status-indicator on" id="status-dot"></div>
        <div>
          <div class="status-label" id="status-label">Active</div>
          <div class="status-detail" id="status-detail">Intercepting PDF files</div>
        </div>
      </div>
      <label class="toggle-switch" title="Enable or disable PDF interception">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="toggle-track"></span>
        <span class="toggle-knob"></span>
      </label>
    </div>
  </div>

  <div class="popup-divider"></div>

  <!-- ─── Open a PDF from disk ───────────────────────────────────────── -->
  <div class="popup-section">
    <div class="section-label">Open a PDF</div>
    <label class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="Choose or drop a PDF file">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg>
      <span class="drop-zone-primary" id="drop-zone-text">Drop a PDF here</span>
      <span class="drop-zone-secondary">or click to choose a file</span>
      <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
    </label>
  </div>

  <!-- ─── Quick Actions ───────────────────────────────────────────────── -->
  <div class="action-list">
    <div class="section-label">Quick Actions</div>

    <button class="action-btn" id="btn-open-in-nivra" disabled title="Open current tab's PDF in Nivra">
      <div class="action-icon blue">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <path d="m10 13 2 2 4-4"/>
        </svg>
      </div>
      <div class="action-text">
        <div class="action-text-primary">Open in Nivra</div>
        <div class="action-text-secondary" id="open-nivra-detail">No PDF detected in this tab</div>
      </div>
      <svg class="action-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <button class="action-btn" id="btn-file-access">
      <div class="action-icon amber">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div class="action-text">
        <div class="action-text-primary">File URL Access</div>
        <div class="action-text-secondary">Enable local PDF support</div>
      </div>
      <svg class="action-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <button class="action-btn" id="btn-keyboard-shortcuts">
      <div class="action-icon green">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="2"/>
          <path d="M6 10h0"/>
          <path d="M10 10h0"/>
          <path d="M14 10h0"/>
          <path d="M18 10h0"/>
          <path d="M8 14h8"/>
        </svg>
      </div>
      <div class="action-text">
        <div class="action-text-primary">Keyboard Shortcuts</div>
        <div class="action-text-secondary">Ctrl+F search, Ctrl+B sidebar…</div>
      </div>
      <svg class="action-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>

  <!-- ─── Footer ──────────────────────────────────────────────────────── -->
  <div class="popup-footer">
    <div class="popup-footer-text">Nivra Visual Engine v1 · Built by <a href="https://bhyresh.me" id="footer-link" target="_blank" rel="noopener noreferrer">Bhyresh</a></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
